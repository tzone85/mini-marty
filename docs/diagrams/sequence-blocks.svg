<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Block editor execution sequence</title>
  <desc id="desc">Sequence diagram. A user drops blocks; BlocklyWorkspace serialises XML to BlockCompiler which produces Python; PythonExecutor runs it through Pyodide; martypy bridge calls VirtualMarty which enqueues into CommandQueue; AnimationPlayer renders to the Scene.</desc>
  <style>
    .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .head { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
    .head-label { fill: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #2563eb; stroke-width: 1.5; fill: none; }
    .msg { fill: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .lifeline { stroke: #475569; }
      .head { fill: #0f172a; stroke: #94a3b8; }
      .head-label { fill: #e2e8f0; }
      .arrow { stroke: #60a5fa; }
      .msg { fill: #e2e8f0; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Heads: 8 lifelines -->
  <g>
    <rect class="head" x="20" y="30" width="100" height="32" rx="8"/>
    <text class="head-label" x="70" y="46">User</text>
    <line class="lifeline" x1="70" y1="62" x2="70" y2="580"/>

    <rect class="head" x="140" y="30" width="120" height="32" rx="8"/>
    <text class="head-label" x="200" y="46">BlocklyWorkspace</text>
    <line class="lifeline" x1="200" y1="62" x2="200" y2="580"/>

    <rect class="head" x="280" y="30" width="110" height="32" rx="8"/>
    <text class="head-label" x="335" y="46">BlockCompiler</text>
    <line class="lifeline" x1="335" y1="62" x2="335" y2="580"/>

    <rect class="head" x="410" y="30" width="110" height="32" rx="8"/>
    <text class="head-label" x="465" y="46">PythonExecutor</text>
    <line class="lifeline" x1="465" y1="62" x2="465" y2="580"/>

    <rect class="head" x="540" y="30" width="90" height="32" rx="8"/>
    <text class="head-label" x="585" y="46">Pyodide</text>
    <line class="lifeline" x1="585" y1="62" x2="585" y2="580"/>

    <rect class="head" x="650" y="30" width="110" height="32" rx="8"/>
    <text class="head-label" x="705" y="46">VirtualMarty</text>
    <line class="lifeline" x1="705" y1="62" x2="705" y2="580"/>

    <rect class="head" x="780" y="30" width="110" height="32" rx="8"/>
    <text class="head-label" x="835" y="46">CommandQueue</text>
    <line class="lifeline" x1="835" y1="62" x2="835" y2="580"/>

    <rect class="head" x="910" y="30" width="80" height="32" rx="8"/>
    <text class="head-label" x="950" y="46">Scene</text>
    <line class="lifeline" x1="950" y1="62" x2="950" y2="580"/>
  </g>

  <!-- Messages -->
  <line class="arrow" x1="70" y1="110" x2="198" y2="110" marker-end="url(#arrow)"/>
  <text class="msg" x="134" y="104">click Run</text>

  <line class="arrow" x1="200" y1="160" x2="333" y2="160" marker-end="url(#arrow)"/>
  <text class="msg" x="265" y="154">workspaceXml</text>

  <line class="arrow" x1="335" y1="210" x2="463" y2="210" marker-end="url(#arrow)"/>
  <text class="msg" x="400" y="204">python source</text>

  <line class="arrow" x1="465" y1="260" x2="583" y2="260" marker-end="url(#arrow)"/>
  <text class="msg" x="525" y="254">runPythonAsync</text>

  <line class="arrow" x1="585" y1="310" x2="703" y2="310" marker-end="url(#arrow)"/>
  <text class="msg" x="645" y="304">marty.walk()</text>

  <line class="arrow" x1="705" y1="360" x2="833" y2="360" marker-end="url(#arrow)"/>
  <text class="msg" x="769" y="354">enqueue(cmd)</text>

  <line class="arrow" x1="835" y1="410" x2="948" y2="410" marker-end="url(#arrow)"/>
  <text class="msg" x="892" y="404">commandStart</text>

  <line class="arrow" x1="948" y1="460" x2="838" y2="460" marker-end="url(#arrow)"/>
  <text class="msg" x="893" y="454">commandComplete</text>

  <line class="arrow" x1="833" y1="510" x2="708" y2="510" marker-end="url(#arrow)"/>
  <text class="msg" x="770" y="504">resolve()</text>

  <line class="arrow" x1="585" y1="560" x2="468" y2="560" marker-end="url(#arrow)"/>
  <text class="msg" x="526" y="554">return / stdout</text>
</svg>
