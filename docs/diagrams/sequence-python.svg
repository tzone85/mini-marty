<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Python editor execution sequence</title>
  <desc id="desc">Sequence diagram. A user clicks Run in MonacoEditor; PythonExecutor wraps the source and submits to Pyodide; the martypy bridge calls VirtualMarty methods which enqueue into CommandQueue; AnimationPlayer drives the Scene.</desc>
  <style>
    .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .head { fill: #ffffff; stroke: #475569; stroke-width: 1.5; }
    .head-label { fill: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #2563eb; stroke-width: 1.5; fill: none; }
    .msg { fill: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .lifeline { stroke: #475569; }
      .head { fill: #0f172a; stroke: #94a3b8; }
      .head-label { fill: #e2e8f0; }
      .arrow { stroke: #60a5fa; }
      .msg { fill: #e2e8f0; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <g>
    <rect class="head" x="20" y="30" width="90" height="32" rx="8"/>
    <text class="head-label" x="65" y="46">User</text>
    <line class="lifeline" x1="65" y1="62" x2="65" y2="580"/>

    <rect class="head" x="130" y="30" width="120" height="32" rx="8"/>
    <text class="head-label" x="190" y="46">MonacoEditor</text>
    <line class="lifeline" x1="190" y1="62" x2="190" y2="580"/>

    <rect class="head" x="270" y="30" width="120" height="32" rx="8"/>
    <text class="head-label" x="330" y="46">PythonExecutor</text>
    <line class="lifeline" x1="330" y1="62" x2="330" y2="580"/>

    <rect class="head" x="410" y="30" width="90" height="32" rx="8"/>
    <text class="head-label" x="455" y="46">Pyodide</text>
    <line class="lifeline" x1="455" y1="62" x2="455" y2="580"/>

    <rect class="head" x="520" y="30" width="120" height="32" rx="8"/>
    <text class="head-label" x="580" y="46">VirtualMarty</text>
    <line class="lifeline" x1="580" y1="62" x2="580" y2="580"/>

    <rect class="head" x="660" y="30" width="130" height="32" rx="8"/>
    <text class="head-label" x="725" y="46">CommandQueue</text>
    <line class="lifeline" x1="725" y1="62" x2="725" y2="580"/>

    <rect class="head" x="810" y="30" width="130" height="32" rx="8"/>
    <text class="head-label" x="875" y="46">AnimationPlayer</text>
    <line class="lifeline" x1="875" y1="62" x2="875" y2="580"/>

    <rect class="head" x="945" y="30" width="40" height="32" rx="8"/>
    <text class="head-label" x="965" y="46">Scene</text>
    <line class="lifeline" x1="965" y1="62" x2="965" y2="580"/>
  </g>

  <line class="arrow" x1="65" y1="110" x2="188" y2="110" marker-end="url(#arrow)"/>
  <text class="msg" x="126" y="104">click Run</text>

  <line class="arrow" x1="190" y1="160" x2="328" y2="160" marker-end="url(#arrow)"/>
  <text class="msg" x="259" y="154">run(code)</text>

  <line class="arrow" x1="330" y1="210" x2="453" y2="210" marker-end="url(#arrow)"/>
  <text class="msg" x="391" y="204">wrapUserCode + runPythonAsync</text>

  <line class="arrow" x1="455" y1="260" x2="578" y2="260" marker-end="url(#arrow)"/>
  <text class="msg" x="516" y="254">marty.walk()</text>

  <line class="arrow" x1="580" y1="310" x2="723" y2="310" marker-end="url(#arrow)"/>
  <text class="msg" x="651" y="304">enqueue(cmd)</text>

  <line class="arrow" x1="725" y1="360" x2="873" y2="360" marker-end="url(#arrow)"/>
  <text class="msg" x="799" y="354">commandStart event</text>

  <line class="arrow" x1="875" y1="410" x2="963" y2="410" marker-end="url(#arrow)"/>
  <text class="msg" x="918" y="404">applyPose(frame)</text>

  <line class="arrow" x1="873" y1="460" x2="728" y2="460" marker-end="url(#arrow)"/>
  <text class="msg" x="800" y="454">commandComplete</text>

  <line class="arrow" x1="723" y1="510" x2="583" y2="510" marker-end="url(#arrow)"/>
  <text class="msg" x="652" y="504">resolve()</text>

  <line class="arrow" x1="453" y1="560" x2="333" y2="560" marker-end="url(#arrow)"/>
  <text class="msg" x="393" y="554">stdout / stderr</text>
</svg>
